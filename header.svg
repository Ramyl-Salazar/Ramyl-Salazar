<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ramyl Monce Salazar</title>
  <desc id="desc">Fourth-year Computer Science student focused on software engineering, Android development, and computer vision.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B17"/>
      <stop offset="0.55" stop-color="#111A35"/>
      <stop offset="1" stop-color="#18103C"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="80" x2="715" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.48" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1030 46) rotate(125) scale(420 500)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#A5B4FC" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#background)"/>
  <rect width="1200" height="340" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>

  <circle cx="1088" cy="68" r="4" fill="#67E8F9"/>
  <circle cx="1128" cy="108" r="7" fill="#818CF8" fill-opacity="0.8"/>
  <circle cx="1048" cy="126" r="3" fill="#C084FC"/>
  <path d="M1015 42L1127 154" stroke="url(#accent)" stroke-opacity="0.28"/>
  <path d="M1052 24L1162 134" stroke="url(#accent)" stroke-opacity="0.16"/>

  <text x="76" y="95" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4">HELLO, I'M</text>
  <text x="72" y="168" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">RAMYL MONCE SALAZAR</text>
  <rect x="76" y="190" width="500" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="76" y="236" fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" font-weight="500">Computer Science @ FEU Tech</text>
  <text x="76" y="274" fill="#A5B4FC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19">Software Engineering  /  Android  /  Computer Vision</text>

  <g filter="url(#shadow)">
    <rect x="790" y="78" width="332" height="205" rx="18" fill="#090E1B" stroke="#334155"/>
    <rect x="790" y="78" width="332" height="43" rx="18" fill="#111827"/>
    <path d="M790 103H1122" stroke="#334155"/>
    <circle cx="816" cy="100" r="5" fill="#FB7185"/>
    <circle cx="836" cy="100" r="5" fill="#FBBF24"/>
    <circle cx="856" cy="100" r="5" fill="#34D399"/>
    <text x="816" y="155" fill="#67E8F9" font-family="Cascadia Code, Consolas, monospace" font-size="16">$ whoami</text>
    <text x="816" y="184" fill="#E2E8F0" font-family="Cascadia Code, Consolas, monospace" font-size="15">student + builder</text>
    <text x="816" y="222" fill="#C084FC" font-family="Cascadia Code, Consolas, monospace" font-size="16">$ next</text>
    <text x="816" y="251" fill="#E2E8F0" font-family="Cascadia Code, Consolas, monospace" font-size="15">ship. learn. improve.</text>
